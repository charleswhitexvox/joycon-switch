name: Compilar APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o switch_joycon_suite.zip
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
      - run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk SwitchJoyCon-Bluetooth.apk
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --yes || true
          gh release create v1.0.0 SwitchJoyCon-Bluetooth.apk --title "APK Lista" --notes "Toca SwitchJoyCon-Bluetooth.apk abajo para instalar"
