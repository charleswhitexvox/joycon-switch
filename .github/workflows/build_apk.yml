name: Compilar APK Switch JoyCon Bluetooth

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Aceptar licencias del Android SDK preinstalado
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 4. Normalizar estructura del proyecto Android y corregir Manifest
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/cfw/switchjoycon

          # Ubicar archivos aunque hayan sido descomprimidos en subcarpetas
          HTML_FILE=$(find . -name "switch_joycon_controller.html" | head -n 1)
          if [ -n "$HTML_FILE" ] && [ "$HTML_FILE" != "./app/src/main/assets/switch_joycon_controller.html" ]; then
            cp "$HTML_FILE" app/src/main/assets/switch_joycon_controller.html
          fi

          MAIN_KT=$(find . -name "MainActivity.kt" | head -n 1)
          if [ -n "$MAIN_KT" ] && [ "$MAIN_KT" != "./app/src/main/java/com/cfw/switchjoycon/MainActivity.kt" ]; then
            cp "$MAIN_KT" app/src/main/java/com/cfw/switchjoycon/MainActivity.kt
          fi

          SERVICE_KT=$(find . -name "SwitchBluetoothHidService.kt" | head -n 1)
          if [ -n "$SERVICE_KT" ] && [ "$SERVICE_KT" != "./app/src/main/java/com/cfw/switchjoycon/SwitchBluetoothHidService.kt" ]; then
            cp "$SERVICE_KT" app/src/main/java/com/cfw/switchjoycon/SwitchBluetoothHidService.kt
          fi

          # Asegurar compatibilidad de null-safety en Kotlin para BluetoothAdapter.name
          sed -i 's/bluetoothAdapter?.name = originalBtName/originalBtName?.let { bluetoothAdapter?.name = it }/g' app/src/main/java/com/cfw/switchjoycon/SwitchBluetoothHidService.kt

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SwitchJoyConBluetooth"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.cfw.switchjoycon'
              compileSdk 34

              defaultConfig {
                  applicationId "com.cfw.switchjoycon"
                  minSdk 28
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:label="Switch JoyCon Bluetooth CFW"
                  android:supportsRtl="true"
